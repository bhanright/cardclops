org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
# Gradle's file-system watching holds build directories open on Windows, and builds then fail
# with "Unable to delete directory". Off costs a few seconds of scanning.
org.gradle.vfs.watch=false

# Machine-specific settings live in %USERPROFILE%\.gradle\gradle.properties, never here:
#   cardclopsBuildPython=C:\path\to\python3.13\python.exe   (Chaquopy needs the app's Python version)
#   cardclopsKeystore=C:\Users\<you>\.cardclops\cardclops-release.jks
#   cardclopsKeystorePassword=...
#   cardclopsKeyAlias=cardclops
#   cardclopsKeyPassword=...
